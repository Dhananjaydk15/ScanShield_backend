# Project identification
sonar.projectKey=my_project_key
sonar.projectName=My Project
sonar.projectVersion=1.0

# Source code location — only scan the 'app' folder
sonar.sources=app

# Exclude virtual environments, tests, and ZAP report files
sonar.exclusions=venv/**, tests/**, zap-reports/**

# Python configuration
sonar.language=py
sonar.python.version=3.9