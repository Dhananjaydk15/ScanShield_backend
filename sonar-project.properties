# Project identification
sonar.projectKey=my_project_key
sonar.projectName=My Project
sonar.projectVersion=1.0

# Source code location — only scan the 'app' folder
sonar.sources=app

# (Optional) Exclude test or virtual environment folders if inside app
sonar.exclusions=app/venv/**, app/tests/**

# Python configuration (if it’s a Python project)
sonar.language=py
sonar.python.version=3.9